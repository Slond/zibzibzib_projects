name: Public content hygiene
on: [push, pull_request]
permissions:
  contents: read
jobs:
  publication-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject host details in tracked content and history
        run: python3 scripts/check_public_content.py --history

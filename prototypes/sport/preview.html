function calendar(){const first=month+'-01',offset=(dayOf(first)+6)%7,start=addDays(first,-offset),days=new Date(Number(month.slice(0,4)),Number(month.slice(5)),0).getDate(),cells=Math.ceil((offset+days)/7)*7,s=current();return heading('Календарь','План и фактические тренировки в одном месте',`<button class="btn secondary" data-action="add">+ Тренировка</button>`)+`<div class="calendar-layout"><section class="panel"><div class="panel-head"><h2 style="text-transform:capitalize">${fmt(first,{month:'long',year:'numeric'})}</h2><div class="inline"><button class="icon-btn" aria-label="Предыдущий месяц" data-action="month-prev">‹</button><button class="btn ghost small" data-action="today">Сегодня</button><button class="icon-btn" aria-label="Следующий месяц" data-action="month-next">›</button></div></div><div class="calendar-weekheads">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>'<span>'+x+'</span>').join('')}</div><div class="calendar-grid">${Array.from({length:cells},(_,i)=>{const d=addDays(start,i),s=current(d);return `<button class="calendar-cell ${d.slice(0,7)!==month?'off':''} ${d===selected?'selected':''} ${d===TODAY?'today':''}" data-action="day" data-date="${d}" aria-label="${fmt(d)}: ${s?T[s.template].title+', '+s.status:'отдых'}" aria-pressed="${d===selected}"><span class="day-number">${Number(d.slice(-2))}</span>${s?`<span class="calendar-event ${s.status}">${s.status==='done'?'✓ ':s.status==='skipped'?'× ':s.status==='moved'?'→ ':''}${T[s.template].title}</span>`:''}</button>`}).join('')}</div><div class="panel-body"><div class="legend"><span><i></i>Выполнено</span><span><i class="planned"></i>По плану</span><span><i class="skipped"></i>Пропуск</span><span><i class="rest"></i>Отдых / перенос</span></div></div></section><aside class="stack"><section class="panel"><div class="panel-body day-detail"><div class="between"><span class="eyebrow">${selected===TODAY?'Сегодня':fmt(selected,{weekday:'long'})}</span>${badge(s)}</div><h2>${fmt(selected)}</h2><h3 style="margin:15px 0 7px">${s?T[s.template].title:'Восстановление'}</h3><p>${s?`${T[s.template].place} · ${idsFor(s).length} упражнений · ~${T[s.template].minutes} мин`:'На этот день тренировки нет. Оставь его для отдыха или добавь занятие.'}${s?.reason?'<br>Причина: '+esc(s.reason):''}${s?.movedTo?'<br>Перенесено на '+fmt(s.movedTo):''}</p>${s&&s.status!=='moved'?`<a class="btn" href="${link('workout',selected)}">${['done','partial'].includes(s.status)?'Результат':'Открыть тренировку'}${icon('arrow')}</a>${!['done','partial'].includes(s.status)?`<button class="btn secondary" data-action="change">Изменить тренировку</button>${selected<=TODAY?`<button class="btn ghost" data-action="skip">${count(s)?'Остановить тренировку':'Тренировки не было'}</button>`:''}`:''}`:`${s?.movedTo?`<a class="btn" href="${link('workout',s.movedTo)}">Открыть перенесённую →</a>`:'<button class="btn" data-action="add">+ Запланировать</button>'}`}</div></section><div class="note">Отдых и пропуск различаются. Пропущенное занятие не переносится автоматически: ты сам выбираешь, что делать дальше.</div></aside></div>`;}
function getSets(s,id){if(!s.sets[id])s.sets[id]=Array.from({length:exercise(id).sets},blankSet);return s.sets[id];}
function workout(){const s=current();if(!s||s.status==='moved')return heading(fmt(selected),s?.movedTo?'Тренировка перенесена на '+fmt(s.movedTo):'На сегодня занятия не запланированы')+`<div class="panel"><div class="panel-body"><h2>${s?.movedTo?'Тренировка перенесена':'День восстановления'}</h2><p class="muted small" style="margin:12px 0 20px">${s?.movedTo?'Исходная запись сохранена. Занятие доступно по новой дате.':'Здесь можно добавить тренировку или оставить день свободным.'}</p>${s?.movedTo?`<a class="btn" href="${link('workout',s.movedTo)}">Открыть перенесённую →</a>`:'<button class="btn" data-action="add">Запланировать тренировку</button>'}</div></div>`;const closed=['done','partial','skipped'].includes(s.status),future=selected>TODAY,locked=closed||future;
return heading(T[s.template].title,`${fmt(selected,{day:'numeric',month:'long',weekday:'long'})} · ${T[s.template].place}`,`<a href="${link('calendar',selected)}" class="btn secondary">${icon('calendar')}Календарь</a>${!['done','partial'].includes(s.status)?'<button class="btn secondary" data-action="change">Изменить</button>':''}`)+`${s.status==='skipped'?`<div class="warning">Тренировки не было: ${esc(s.reason)}. <button class="subtle-link" data-action="restore">Вернуть в план</button></div>`:''}${future?'<div class="warning">Будущая тренировка. План можно менять, подходы отмечаются в день занятия или позже.</div>':''}<div class="session-summary">${badge(s)}<div><small>Упражнения</small><b>${idsFor(s).length}</b></div><div><small>Подходы</small><b id="session-count">${count(s)} / ${total(s)}</b></div><div><small>${closed?'Записано':'По плану'}</small><b>${s.duration||T[s.template].minutes} мин</b></div><div><small>Вариант</small><b>${s.template!==s.originalTemplate?'Изменён на этот день':'По программе'}</b></div></div><div class="workout-layout"><div><div class="note" style="margin-bottom:20px">Демонстрационная нагрузка. Поля «Вес» и «Повторы» — фактический результат; план не отмечается выполненным автоматически. Вес гантелей указан для одной гантели.</div>${idsFor(s).map((id,i)=>{const e=exercise(id),sets=getSets(s,id);return `<section class="exercise-block"><div class="exercise-top"><span class="exercise-num">${String(i+1).padStart(2,'0')}</span><div class="exercise-title"><button data-action="technique" data-id="${id}">${e.name}</button><p>${e.sets} × ${e.reps} · отдых ${e.rest} сек</p></div><button class="btn secondary small" data-action="technique" data-id="${id}">${icon('play')}Как делать</button>${!locked?`<button class="icon-btn" data-action="replace-exercise" data-id="${id}" aria-label="Заменить: ${e.name}">⇄</button>`:''}</div><div class="set-grid header"><span>Подход</span><span>${e.weight===0?'Вес, кг¹':'Вес, кг'}</span><span>Повторы</span><span>Прошлый раз²</span><span>Готово</span></div>${sets.map((set,n)=>`<div class="set-grid ${set.done?'complete':''}"><span class="set-number">${n+1}</span><input type="number" min="0" max="2000" step="0.5" inputmode="decimal" aria-label="Вес, ${e.name}, подход ${n+1}" placeholder="${e.weight===0?'0':'кг'}" value="${esc(set.weight)}" data-field="weight" data-id="${id}" data-index="${n}" ${locked?'disabled':''}><input type="number" min="1" max="500" step="1" inputmode="numeric" aria-label="Повторы, ${e.name}, подход ${n+1}" placeholder="${e.reps}" value="${esc(set.reps)}" data-field="reps" data-id="${id}" data-index="${n}" ${locked?'disabled':''}><span class="last">${esc(e.last)}</span><label class="check"><input type="checkbox" aria-label="Готово, ${e.name}, подход ${n+1}" data-field="done" data-id="${id}" data-index="${n}" ${set.done?'checked':''} ${locked?'disabled':''}></label></div>`).join('')}</section>`}).join('')}<p class="tiny muted">¹ Без дополнительного веса — 0 кг. ² Значения прошлого занятия — фиксированные примеры демо.</p><div class="workout-footer">${!locked?`<button class="btn ghost" data-action="skip">${count(s)?'Остановить':'Тренировки не было'}</button><button class="btn" id="finish-button" data-action="finish" ${!count(s)?'disabled':''}>${icon('check')}Завершить тренировку</button>`:closed?'<button class="btn secondary" data-action="reopen">Исправить запись</button>':''}</div></div><aside class="stack sticky"><section class="panel"><div class="panel-body"><div class="eyebrow">Отдых между подходами</div><div class="timer-number" id="timer-number">01:30</div><div class="timer-label" id="timer-label">Запускается после отметки подхода</div><div class="timer-settings">${[60,90,120].map(t=>`<button class="btn secondary small" data-action="timer-set" data-seconds="${t}">${t} с</button>`).join('')}</div><div class="inline"><button class="btn secondary small" data-action="timer-toggle" id="timer-toggle">Старт</button><button class="btn ghost small" data-action="timer-reset">Сбросить</button></div></div></section><section class="panel"><div class="panel-body"><h3>Как самочувствие?</h3><label class="section-space">Перед тренировкой<select id="feel" ${locked?'disabled':''}><option value="good" ${s.feel==='good'?'selected':''}>Всё хорошо</option><option value="tired" ${s.feel==='tired'?'selected':''}>Усталость</option><option value="low" ${s.feel==='low'?'selected':''}>Мало энергии</option></select></label><label class="section-space">Заметка к занятию<textarea id="session-note" rows="4" maxlength="1500" placeholder="Как прошла тренировка, что изменить…" ${locked?'disabled':''}>${esc(s.note)}</textarea></label><p class="notice">Усталость можно записать без автоматической оценки готовности.</p></div></section><div class="note">Тренажёр занят? Замени одно упражнение. Подходы с результатами сохраняются, для замены нужна ещё не начатая часть.</div></aside></div>`;}
function thumbnail(e){return e.youtube?`<img src="https://i.ytimg.com/vi/${e.youtube}/hqdefault.jpg" alt="" loading="lazy">`:`<svg width="66" height="66" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">${icons.sport}</svg>`;}
function library(){return heading('Упражнения','Техника, оборудование и варианты замены',`<button class="btn secondary" data-action="match">${icon('search')}Подобрать по названию</button>`)+`<div class="toolbar"><input type="search" id="exercise-search" placeholder="Название, мышца или английский термин…" aria-label="Поиск упражнений" value="${esc(query)}"><select id="muscle-filter" aria-label="Группа мышц"><option value="">Все мышцы</option>${[...new Set(EX.map(e=>e.muscle))].map(v=>`<option ${muscleFilter===v?'selected':''}>${v}</option>`).join('')}</select><select id="equipment-filter" aria-label="Оборудование"><option value="">Любой инвентарь</option>${[...new Set(EX.map(e=>e.equipment))].map(v=>`<option ${equipmentFilter===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="between small muted" style="margin-bottom:16px"><span id="exercise-count">${EX.length} упражнений в демокаталоге</span><span>Источник: Muscle & Strength</span></div><div class="exercise-grid" id="exercise-results">${libraryCards(EX)}</div><p class="notice">Поиск работает по 9 подготовленным примерам и их синонимам. Поиск новых страниц в интернете пока не подключён. Видео загружаются только по нажатию; если плеер недоступен, открой страницу источника.</p>`;}
function libraryCards(items){return items.map(e=>`<article class="exercise-card"><button class="exercise-art" data-action="technique" data-id="${e.id}" aria-label="Как делать: ${e.name}">${thumbnail(e)}<span class="play">${icon('play')}</span><span class="art-label">${e.youtube?'Видео':'Видео · Vimeo'}</span></button><div class="exercise-card-body"><span class="badge">${e.muscle}</span><h3><button class="row-link" data-action="technique" data-id="${e.id}">${e.name}</button></h3><div class="en">${e.en}</div><div class="between"><span class="tiny muted">${e.equipment}</span><button class="btn secondary small" data-action="technique" data-id="${e.id}">Как делать →</button></div></div></article>`).join('')||'<div class="empty" style="grid-column:1/-1">В демокаталоге совпадений нет. Попробуй английское название или другой инвентарь.</div>';}
function searchItems(q){q=q.toLocaleLowerCase().replace(/ё/g,'е').trim();const tokens=q.split(/\s+/).filter(Boolean);return EX.filter(e=>tokens.every(t=>[e.name,e.en,e.muscle,e.equipment,e.aliases].join(' ').toLocaleLowerCase().replace(/ё/g,'е').includes(t)));}
function filterLibrary(){const items=searchItems(query).filter(e=>(!muscleFilter||e.muscle===muscleFilter)&&(!equipmentFilter||e.equipment===equipmentFilter));$('#exercise-results').innerHTML=libraryCards(items);$('#exercise-count').textContent=`${items.length} из ${EX.length} упражнений`;}
function program(){return heading('Моя программа','План задаёт направление, журнал сохраняет реальность',`<button class="btn secondary" data-action="preferences">Настроить расписание</button>`)+`<div class="program-layout"><section class="panel"><div class="panel-body"><span class="badge green">Демонстрационный шаблон</span><h2 style="font-size:27px;margin:16px 0 9px">Сила в привычке</h2><p class="small muted">${esc(state.preferences.goal)} · ${state.preferences.days.length} дн. в неделю · ${esc(state.preferences.time)}</p><p class="notice">Пример для обсуждения интерфейса. Настоящую программу добавим после выбора цели, опыта, ограничений и доступного оборудования.</p></div>${state.preferences.days.map(wd=>[[ 'ВС','ПН','ВТ','СР','ЧТ','ПТ','СБ'][wd],wd===1?'upper':'lower']).map(([wd,k])=>`<div class="template-row"><span class="day-label">${wd}</span><div class="template-info"><h3>${T[k].title}</h3><p>${T[k].place} · ${T[k].ids.length} упражнений · ~${T[k].minutes} мин</p></div><button class="btn secondary small" data-action="template" data-template="${k}">Состав →</button></div>`).join('')}<div class="template-row"><span class="day-label">ДОМ</span><div class="template-info"><h3>Запасной вариант</h3><p>Без инвентаря · 2 упражнения · ~20 мин</p></div><button class="btn secondary small" data-action="template" data-template="home">Состав →</button></div></section><aside class="stack"><section class="panel"><div class="panel-body"><h3>Что я бы заложил сразу</h3><div class="suggestion section-space"><h3>План и факт отдельно</h3><p>Изменение одного дня не переписывает всю программу.</p></div><div class="suggestion"><h3>Сравнивать сопоставимое</h3><p>Прогресс одного упражнения — с его прошлой версией, оборудованием и единицей веса.</p></div><div class="suggestion"><h3>Замена с подтверждением</h3><p>У похожего названия может быть другая техника. Показываем кандидата и источник.</p></div></div></section><div class="note">Для следующей версии: редактирование шаблонов, разминка отдельно от рабочих подходов, личная история упражнения и напоминания по желанию.</div></aside></div>`;}
function history(){const records=Object.entries(state.sessions).filter(([d,s])=>['done','partial','skipped','moved'].includes(s.status)).sort(([a],[b])=>b.localeCompare(a));return heading('История','Результаты, пропуски и изменения плана',`<button class="btn secondary" data-action="export">Экспорт</button><button class="btn ghost" data-action="reset">Сбросить демо</button>`)+`<div class="dashboard"><section class="panel"><div class="panel-head"><h2>Журнал тренировок</h2><span class="badge">${records.length} записей</span></div>${records.map(([d,s])=>`<div class="log-entry"><div class="between"><div><span class="tiny muted">${fmt(d,{day:'numeric',month:'long',weekday:'short'})}</span><h3 style="margin-top:5px"><a href="${link('workout',d)}">${T[s.template].title}</a></h3></div>${badge(s)}</div><div class="history-summary"><span>${T[s.template].place}</span>${count(s)?`<span>${count(s)} подходов</span>`:''}${s.duration?`<span>${s.duration} мин</span>`:''}</div>${s.reason?`<p>${esc(s.reason)}</p>`:''}${s.note?`<p>${esc(s.note)}</p>`:''}${s.movedTo?`<p>Перенесено на ${fmt(s.movedTo)}</p>`:''}${s.template!==s.originalTemplate?`<p>Исходный план: ${T[s.originalTemplate].title} · ${T[s.originalTemplate].place}</p>`:''}${s.revisions.length?`<p>${s.revisions.map(r=>esc(r)).join(' · ')}</p>`:''}<a class="subtle-link" href="${link('workout',d)}">${s.status==='skipped'?'Исправить запись':'Открыть запись'} →</a></div>`).join('')||'<div class="empty">Записей пока нет. Завершённые и пропущенные занятия появятся здесь.</div>'}</section><aside class="stack"><section class="panel"><div class="panel-head"><h2>Изменения в демо</h2></div><div class="panel-body">${state.events.length?state.events.slice(0,12).map(e=>`<div class="suggestion"><div class="tiny muted">${fmt(e.day)}</div><p>${esc(e.label)}</p></div>`).join(''):'<p class="small muted">Здесь появятся переносы, замены и исправления, сделанные в прототипе.</p>'}${state.undo?'<button class="btn secondary section-space" data-action="undo">Отменить последнее действие</button>':''}</div></section><div class="note">Записи хранятся в этом браузере. Экспорт включает результаты, заметки и историю изменений. Синхронизацию с аккаунтом подключим в рабочей версии.</div></aside></div>`;}
function nutrition(){return `<div class="nutrition-empty"><span class="badge">Следующий раздел</span><h1>Питание</h1><p>Питание будет отдельным разделом в главном меню сайта. Сначала проверим сценарии спорта, затем спроектируем дневник, план приёмов пищи и добавление продуктов.</p><a class="btn section-space" href="index.html">К спорту ${icon('arrow')}</a></div>`;}
const modal=$('#modal');
function showModal(title,body,{wide=false}={}){modal.className=wide?'tech-dialog':'';modal.innerHTML=`<div class="modal-head"><h2 id="modal-title">${title}</h2><button class="icon-btn" data-action="close" aria-label="Закрыть">${icon('close')}</button></div><div class="modal-body">${body}</div>`;modal.setAttribute('aria-labelledby','modal-title');modal.showModal();}
function closeModal(){modal.close();modal.innerHTML='';}
function technique(id){const e=exercise(id);if(!e)return;showModal(e.name,`<div class="video-cover" id="video-cover">${thumbnail(e)}<div class="video-cta"><button class="btn" data-action="load-video" data-id="${id}">${icon('play')}Смотреть технику</button><p>Видео Muscle & Strength · ${e.youtube?'YouTube':'Vimeo'} · нужен интернет</p></div></div><a class="source-link" href="${source(e)}" target="_blank" rel="noopener noreferrer">Открыть видео и инструкцию на Muscle & Strength ↗</a><div class="divider"></div><div class="tech-grid"><div><h3>Короткая памятка</h3><ol>${e.tips.map(t=>'<li>'+t+'</li>').join('')}</ol></div><div><h3>Об упражнении</h3><p style="margin-top:12px">${e.en}<br>${e.muscle}<br>${e.equipment}</p><p class="notice">Сверяй точный вариант упражнения с видео. Памятка сокращена для интерфейса.</p></div></div>`,{wide:true});}
function changeModal(){const s=current();if(!s)return;if(count(s)||s.status==='started'||Object.values(s.sets).flat().some(x=>x.weight!==''||x.reps!=='')){showModal('Тренировка уже начата','<p>В записи уже есть начало или результаты. Можно заменить отдельное ещё не выполненное упражнение. Для переноса или смены всего занятия сначала заверши текущую запись.</p><div class="modal-actions"><button class="btn" data-action="close">Понятно</button></div>');return;}showModal('Изменить тренировку',`<p>${fmt(selected)} · ${T[s.template].title}. Изменится только этот день. Исходный план сохранится в истории.</p><form id="change-form"><label class="section-space">Вариант<select name="template">${Object.entries(T).map(([k,v])=>`<option value="${k}" ${k===s.template?'selected':''}>${v.title} · ${v.place} · ~${v.minutes} мин</option>`).join('')}</select></label><p class="notice">Домашний вариант — другой шаблон, а не автоматический эквивалент нагрузки в зале.</p><div class="modal-actions"><button type="button" class="btn secondary" data-action="move">Перенести на дату</button><button class="btn">Применить на этот день</button></div></form>`);}
function skipModal(){const s=current();if(!s)return;if(selected>TODAY){toast('Будущее занятие можно перенести или изменить.');return;}const partial=count(s)>0;showModal(partial?'Остановить тренировку':'Тренировки не было',`<p>${partial?'Выполненные подходы сохранятся. Занятие получит статус «Частично».':'Отметим пропуск, сохранив план. Причину можно не указывать.'}</p><form id="skip-form"><div class="reason-options">${['Не было времени','Самочувствие','Изменились планы','Без причины'].map((v,i)=>`<label><input type="radio" name="reason" value="${v}" ${i===3?'checked':''}>${v}</label>`).join('')}</div><label>Комментарий<textarea name="note" rows="3" maxlength="500" placeholder="По желанию"></textarea></label>${partial?'<label class="section-space">Сколько минут занимался<input name="duration" type="number" min="1" max="600" value="20" required></label>':''}<div class="modal-actions"><button type="button" class="btn secondary" data-action="close">Вернуться</button><button class="btn">${partial?'Сохранить часть тренировки':'Отметить пропуск'}</button></div></form>`);}
function moveModal(){closeModal();showModal('Перенести тренировку',`<p>Исходная дата останется в календаре с пометкой о переносе. Другие занятия не сдвигаются.</p><form id="move-form"><label class="section-space">Новая дата<input type="date" name="date" required value="${addDays(selected,1)}"></label><div class="modal-actions"><button type="button" class="btn secondary" data-action="close">Отмена</button><button class="btn">Перенести</button></div><p class="notice" id="form-error" role="alert"></p></form>`);}
function addModal(){showModal('Запланировать тренировку',`<form id="add-form"><div class="form-grid"><label>Дата<input name="date" type="date" required value="${selected}"></label><label>Шаблон<select name="template">${Object.entries(T).map(([k,v])=>`<option value="${k}">${v.title} · ${v.place}</option>`).join('')}</select></label></div><p class="notice">На прошлую дату можно добавить занятие и записать фактические подходы.</p><p class="notice" id="form-error" role="alert"></p><div class="modal-actions"><button type="button" class="btn secondary" data-action="close">Отмена</button><button class="btn">Добавить в календарь</button></div></form>`);}
function finishModal(){const s=current();if(!s||!count(s))return;const partial=count(s)<total(s),elapsed=s.duration||(s.startedAt?Math.max(1,Math.round((Date.now()-s.startedAt)/60000)):T[s.template].minutes);showModal(partial?'Сохранить частичную тренировку?':'Завершить тренировку',`<p>Отмечено ${count(s)} из ${total(s)} подходов. ${partial?'Неотмеченные подходы останутся невыполненными. Статус — «Частично».':'Все подходы выполнены. Результаты появятся в истории.'}</p><form id="finish-form"><label class="section-space">Фактическая длительность, мин<input type="number" name="duration" value="${Math.min(elapsed,600)}" min="1" max="600" required></label><div class="modal-actions"><button type="button" class="btn secondary" data-action="close">Продолжить</button><button class="btn">Сохранить результат</button></div></form>`);}
function matchModal(replaceId=null){if(replaceId){const s=current();if(getSets(s,replaceId).some(x=>x.done||x.weight!==''||x.reps!=='')){toast('У упражнения уже есть запись. Сначала исправь или удали её значения.');return;}}showModal(replaceId?'Заменить упражнение':'Подобрать по названию',`<p>${replaceId?'Выбери вариант под доступное оборудование. Замена изменит только этот день.':'Введи русское или английское название. В демо поиск идёт по подготовленному каталогу.'}</p><input id="match-search" class="section-space" type="search" placeholder="Например: жим ногами или leg press" aria-label="Название для подбора" data-replace="${replaceId||''}"><div id="match-results">${matchResults(EX,replaceId)}</div><a class="source-link" id="external-search" href="https://www.muscleandstrength.com/exercises" target="_blank" rel="noopener noreferrer">Открыть каталог Muscle & Strength ↗</a><p class="notice">Автоматический поиск новых страниц появится в рабочей версии. Перед закреплением проверяем движение, оборудование и вариант техники.</p>`);}
function matchResults(items,replaceId){return items.filter(e=>!replaceId||!idsFor(current()).includes(e.id)).map(e=>`<div class="search-result"><div><h3>${e.name}</h3><p>${e.en} · ${e.equipment}</p></div><button class="btn secondary small" data-action="${replaceId?'confirm-replace':'technique'}" data-id="${e.id}" ${replaceId?'data-old="'+replaceId+'"':''}>${replaceId?'Выбрать':'Превью'}</button></div>`).join('')||'<p class="section-space">Совпадений в демокаталоге нет.</p>';}
function setTimer(seconds,start=false){timerRemaining=seconds;timerEnd=start?Date.now()+seconds*1000:0;updateTimer();}
function updateTimer(){if(!$('#timer-number'))return;const seconds=timerEnd?Math.max(0,Math.ceil((timerEnd-Date.now())/1000)):timerRemaining;$('#timer-number').textContent=`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;$('#timer-toggle').textContent=timerEnd?'Пауза':'Старт';$('#timer-label').textContent=timerEnd?'Можно закрыть карточку — отсчёт продолжится':'Запускается после отметки подхода';if(timerEnd&&seconds===0){timerEnd=0;timerRemaining=0;toast('Отдых завершён');$('#timer-label').textContent='Отдых завершён';$('#timer-toggle').textContent='Старт';}}
setInterval(updateTimer,500);
function exportData(){const blob=new Blob([JSON.stringify({...state,undo:null},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='sport-demo-2026-10-16.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function prefsModal(){showModal('Расписание и цель',`<p>Изменения применятся к плановым занятиям с 19 по 31 октября. История и дни с ручными изменениями сохранятся.</p><form id="prefs-form"><label class="section-space">Цель<input name="goal" value="${esc(state.preferences.goal)}" maxlength="80" required></label><label class="section-space">Привычное время<input type="time" name="time" value="${esc(state.preferences.time)}" required></label><div class="schedule-days">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map((v,i)=>`<label>${v}<input type="checkbox" name="days" value="${(i+1)%7}" ${state.preferences.days.includes((i+1)%7)?'checked':''}></label>`).join('')}</div><p class="notice">Понедельник — «Верх тела», остальные выбранные дни — «Ноги и ягодицы». Вариант дня можно заменить в календаре. Редактор самой программы — следующий шаг.</p><p id="form-error" class="notice" role="alert"></p><div class="modal-actions"><button type="button" class="btn secondary" data-action="close">Отмена</button><button class="btn">Применить расписание</button></div></form>`);}
function templateModal(k){showModal(T[k].title,`<p>${T[k].place} · ~${T[k].minutes} мин · демонстрационный шаблон</p>${T[k].ids.map(id=>{const e=exercise(id);return `<div class="search-result"><div><h3>${e.name}</h3><p>${e.sets} × ${e.reps} · ${e.rest} сек отдыха</p></div><button class="btn secondary small" data-action="technique" data-id="${id}">Техника</button></div>`}).join('')}`);}
document.addEventListener('click',ev=>{if(standalone){const a=ev.target.closest('a[href]');if(a&&!a.target){const u=new URL(a.href),file=u.pathname.split('/').pop(),routes={ 'index.html':'overview','calendar.html':'calendar','workout.html':'workout','exercises.html':'exercises','program.html':'program','history.html':'history','nutrition.html':'nutrition' };if(routes[file]&&!u.pathname.includes('/jobs/')){ev.preventDefault();location.hash=routes[file]+u.search;return;}}}const b=ev.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(b.dataset.date&&a!=='day')selected=b.dataset.date;switch(a){case'close':closeModal();break;case'undo':undo();break;case'change':changeModal();break;case'skip':skipModal();break;case'move':moveModal();break;case'add':addModal();break;case'finish':finishModal();break;case'day':selected=b.dataset.date;month=selected.slice(0,7);render();break;case'today':selected=TODAY;month=TODAY.slice(0,7);render();break;case'month-prev':case'month-next':{const v=date(month+'-01');v.setUTCMonth(v.getUTCMonth()+(a==='month-next'?1:-1));month=iso(v).slice(0,7);render();break;}case'technique':if(modal.open)closeModal();technique(b.dataset.id);break;case'load-video':{const e=exercise(b.dataset.id);$('#video-cover').innerHTML=`<iframe title="Техника: ${esc(e.name)}" src="${e.youtube?'https://www.youtube.com/embed/'+e.youtube+'?autoplay=1&rel=0':'https://player.vimeo.com/video/'+e.vimeo+'?autoplay=1'}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>`;break;}case'timer-set':setTimer(Number(b.dataset.seconds));break;case'timer-reset':setTimer(90);break;case'timer-toggle':if(timerEnd){timerRemaining=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));timerEnd=0;}else timerEnd=Date.now()+(timerRemaining||90)*1000;updateTimer();break;case'restore':mutate('Тренировка возвращена в план',()=>{const s=current();s.revisions.push('Пропуск отменён: '+(s.reason||'без причины'));s.status='planned';delete s.reason;});break;case'reopen':mutate('Запись открыта для исправления',()=>{const s=current();s.status=count(s)?'started':'planned';if(s.reason){s.revisions.push('До исправления: '+s.reason);delete s.reason;}});break;case'match':matchModal();break;case'replace-exercise':matchModal(b.dataset.id);break;case'confirm-replace':{const old=b.dataset.old,id=b.dataset.id;closeModal();mutate('Упражнение заменено',()=>{const s=current();s.customIds=idsFor(s).map(x=>x===old?id:x);s.revisions.push(exercise(old).name+' → '+exercise(id).name);s.manual=true;});break;}case'preferences':prefsModal();break;case'template':templateModal(b.dataset.template);break;case'export':exportData();break;case'reset':showModal('Восстановить демо?','<p>Текущая версия сохранится для отмены. Перед сбросом можно скачать экспорт.</p><div class="modal-actions"><button class="btn secondary" data-action="export">Экспорт</button><button class="btn" data-action="reset-confirm">Восстановить примеры</button></div>');break;case'reset-confirm':closeModal();mutate('Демо восстановлено',()=>{const old=state;state=seed();state.undo=old.undo;});break;}});
document.addEventListener('input',ev=>{const el=ev.target;if(el.matches('[data-field="weight"],[data-field="reps"]')){const s=current();if(!s||['done','partial','skipped'].includes(s.status)||selected>TODAY)return;const set=getSets(s,el.dataset.id)[Number(el.dataset.index)];set[el.dataset.field]=el.value;if(set.done){set.done=false;el.closest('.set-grid').querySelector('input[type=checkbox]').checked=false;el.closest('.set-grid').classList.remove('complete');}if($('#session-count'))$('#session-count').textContent=count(s)+' / '+total(s);if($('#finish-button'))$('#finish-button').disabled=!count(s);state.undo=null;save();}else if(el.id==='session-note'){current().note=el.value;state.undo=null;save();}else if(el.id==='exercise-search'){query=el.value;filterLibrary();}else if(el.id==='match-search'){const items=searchItems(el.value);$('#match-results').innerHTML=matchResults(items,el.dataset.replace||null);$('#external-search').href=el.value.trim()?'https://www.google.com/search?q='+encodeURIComponent('site:muscleandstrength.com/exercises/ '+el.value.trim()):'https://www.muscleandstrength.com/exercises';$('#external-search').textContent=el.value.trim()?'Найти на Muscle & Strength через Google ↗':'Открыть каталог Muscle & Strength ↗';}});
document.addEventListener('change',ev=>{const el=ev.target;if(el.matches('[data-field="done"]')){const s=current(),e=exercise(el.dataset.id),set=getSets(s,e.id)[Number(el.dataset.index)];if(el.checked){const row=el.closest('.set-grid'),inputs=[...row.querySelectorAll('input[type=number]')];if(set.weight===''&&e.weight===0){set.weight='0';inputs[0].value='0';}if(set.weight===''||set.reps===''||!inputs.every(x=>x.checkValidity())){el.checked=false;toast('Введи корректный вес и число повторов этого подхода');return;}if(!s.startedAt)s.startedAt=Date.now();s.status='started';setTimer(e.rest,true);}set.done=el.checked;state.undo=null;save();render();}else if(el.id==='feel'){current().feel=el.value;state.undo=null;save();}else if(el.id==='muscle-filter'){muscleFilter=el.value;filterLibrary();}else if(el.id==='equipment-filter'){equipmentFilter=el.value;filterLibrary();}});
document.addEventListener('submit',ev=>{if(!ev.target.matches('dialog form'))return;ev.preventDefault();const f=ev.target,data=new FormData(f),s=current();switch(f.id){case'change-form':{const k=data.get('template');closeModal();if(k===s.template&&s.status!=='skipped')return;mutate('Вариант тренировки изменён',()=>{s.revisions.push(T[s.template].title+' → '+T[k].title+(s.reason?' · до этого пропуск: '+s.reason:''));s.template=k;s.status='planned';s.sets={};delete s.customIds;delete s.reason;s.manual=true;});break;}case'skip-form':{const reason=data.get('reason'),note=data.get('note'),duration=Number(data.get('duration'));closeModal();timerEnd=0;mutate(count(s)?'Сохранена частичная тренировка':'Отмечен пропуск тренировки',()=>{s.status=count(s)?'partial':'skipped';s.reason=reason==='Без причины'?'':reason;if(note)s.note=(s.note?s.note+'\n':'')+note;if(count(s))s.duration=duration;s.manual=true;});break;}case'move-form':{const d=data.get('date');if(d===selected){$('#form-error').textContent='Выбери другую дату.';return;}if(current(d)){$('#form-error').textContent='На эту дату уже есть запись. Выбери свободный день.';return;}closeModal();mutate('Тренировка перенесена на '+fmt(d),()=>{state.sessions[d]={...clone(s),status:'planned',manual:true,movedFrom:selected};s.status='moved';s.movedTo=d;s.manual=true;});break;}case'add-form':{const d=data.get('date'),k=data.get('template');if(current(d)){$('#form-error').textContent='На эту дату уже есть запись. Измени её через календарь.';return;}closeModal();mutate('Тренировка добавлена на '+fmt(d),()=>{state.sessions[d]={template:k,originalTemplate:k,status:'planned',sets:{},revisions:[],note:'',feel:'good',manual:true};selected=d;month=d.slice(0,7);},d);break;}case'finish-form':{const duration=Number(data.get('duration'));closeModal();timerEnd=0;mutate('Результат тренировки сохранён',()=>{s.status=count(s)===total(s)?'done':'partial';s.duration=duration;s.manual=true;});break;}case'prefs-form':{const days=data.getAll('days').map(Number);if(!days.length){$('#form-error').textContent='Выбери хотя бы один день.';return;}closeModal();mutate('Расписание обновлено с 19 октября',()=>{state.preferences={goal:data.get('goal'),time:data.get('time'),days};for(let n=19;n<=31;n++){const d='2026-10-'+n,old=current(d);if(old&&(old.manual||old.status!=='planned'))continue;if(!days.includes(dayOf(d))){delete state.sessions[d];continue;}if(!old)state.sessions[d]={template:dayOf(d)===1?'upper':'lower',originalTemplate:dayOf(d)===1?'upper':'lower',status:'planned',sets:{},revisions:[],note:'',feel:'good'};}});break;}}});
modal.addEventListener('cancel',()=>{modal.innerHTML='';});
window.addEventListener('storage',ev=>{if(ev.key===KEY){storageOk=false;loadWarning='Данные изменились в другой вкладке. Перезагрузи страницу перед дальнейшими изменениями.';updateStorage();}});
function readRoute(){const [route,q='']=location.hash.slice(1).split('?');if(['overview','calendar','workout','exercises','program','history','nutrition'].includes(route))page=route;const d=new URLSearchParams(q).get('date');selected=d&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&!isNaN(date(d))?d:TODAY;month=selected.slice(0,7);document.title=(page==='nutrition'?'Питание':'Спорт')+' · zibzibzib';if(modal.open)closeModal();timerEnd=0;boot();window.scrollTo(0,0);}
if(standalone){window.addEventListener('hashchange',readRoute);readRoute();}else boot();
})();

</script></body></html>
